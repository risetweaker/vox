[package]
name = "vox"
version = "0.1.0"
description = "VOX cross-platform tweaking utility"
authors = ["VOX"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
